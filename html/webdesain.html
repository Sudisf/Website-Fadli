<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      background: #090d16;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }

    .floating-text {
      font-size: 36px;
      font-weight: 800;
      color: #f43f5e;
      text-shadow: 0 0 15px rgba(244, 63, 94, 0.6);
      animation: melayang 3s ease-in-out infinite;
    }

    @keyframes melayang {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-15px) scale(1.05);
        text-shadow: 0 0 25px rgba(244, 63, 94, 0.9);
      }
    }
  </style>
</head>
<body>

  <h1 class="floating-text">✨ DLIX ✨</h1>

</body>
</html>
